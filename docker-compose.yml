version: '3.8'

services:
  backend:
    image: wwwzhouhui569/jimeng-slides-server:latest
    container_name: jimeng-slides-backend
    ports:
      # 宿主机端口:容器内部端口（由 PORT 控制，默认 5000）
      # 外部访问始终是 http://localhost:5000，内部监听端口可通过 PORT 调整
      - "5000:${PORT:-5000}"
    # 从 .env 文件自动加载所有环境变量
    env_file:
      - .env
    volumes:
      # 持久化数据库
      - ./backend/instance:/app/backend/instance
      # 持久化上传的文件
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      # 健康检查同样跟随 PORT（默认 5000）
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - jimeng-slides-network

  frontend:
    image: wwwzhouhui569/jimeng-slides-web:latest
    container_name: jimeng-slides-frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jimeng-slides-network

networks:
  jimeng-slides-network:
    driver: bridge

volumes:
  backend-data:
  uploads-data:

